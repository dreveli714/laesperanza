<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finca La Esperanza">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Finca La Esperanza</title>
<style>
  :root{
    --bg:#EFEFF3; --surface:#FFFFFF; --surface-press:#F1F1F4;
    --label:#0E0F13; --secondary:#8A8A8F; --tertiary:#C3C3C8;
    --separator:rgba(60,60,67,.13);
    --accent:#137A4F; --accent-press:#0F6341; --accent-soft:#E4F1EA;
    --gold:#B8871C; --rust:#BB4D2C; --slate:#5E6B78; --danger:#D8452E;
    --radius:16px; --radius-lg:22px;
    --shadow-card:0 1px 2px rgba(16,17,19,.04), 0 8px 22px rgba(16,17,19,.05);
    --shadow-btn:0 1px 2px rgba(16,17,19,.10);
    --tap:54px;
    font-size:17px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--label);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .app{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .ic{width:1.4em;height:1.4em;display:inline-block;vertical-align:middle;}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

  /* ===== Chrome esmerilado (top bar) ===== */
  header{position:sticky;top:0;z-index:20;
    background:rgba(248,248,250,.80);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--separator);
    padding:calc(env(safe-area-inset-top) + 9px) 16px 9px;display:flex;align-items:center;gap:10px;}
  header .badge{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#fff;box-shadow:0 0 0 .5px var(--separator);}
  header .wm{flex:1;font-size:1.02rem;font-weight:700;letter-spacing:-.2px;}
  header .gear{background:none;border:none;color:var(--accent);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  header .gear:active{background:var(--surface-press);}
  header .gear .ic{width:23px;height:23px;}
  .statusline{text-align:center;font-size:.74rem;color:var(--secondary);padding:5px 16px 0;display:flex;align-items:center;justify-content:center;gap:6px;}
  .statusline .dot{width:7px;height:7px;border-radius:50%;background:#34C759;}
  .statusline.pend .dot{background:var(--gold);} .statusline.off .dot{background:#FF9F0A;}

  main{flex:1;padding:6px 16px 108px;}
  .screen{animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* ===== Títulos grandes (large title iOS) ===== */
  .ltitle{font-size:2rem;font-weight:800;letter-spacing:-.6px;margin:8px 0 2px;line-height:1.08;}
  .lsub{color:var(--secondary);font-size:.98rem;margin:0 0 18px;font-weight:500;}
  .backrow{padding:8px 0 2px;}
  .back{background:none;border:none;color:var(--accent);font-size:1.04rem;font-weight:500;cursor:pointer;padding:6px 6px 6px 0;display:inline-flex;align-items:center;gap:1px;margin-left:-4px;}
  .back .ic{width:22px;height:22px;}

  /* ===== Listas agrupadas (estilo Ajustes) ===== */
  .ghead{font-size:.8rem;font-weight:600;color:var(--secondary);margin:24px 0 7px 16px;letter-spacing:.1px;}
  .ghead:first-child{margin-top:6px;}
  .lgroup{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-card);}
  .grow{display:flex;align-items:center;gap:13px;padding:12px 14px;min-height:56px;position:relative;width:100%;background:var(--surface);border:none;text-align:left;color:var(--label);font-family:inherit;font-size:1.02rem;}
  .grow+.grow::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--separator);}
  .lgroup.inset .grow+.grow::before{left:60px;}
  .grow.tap{cursor:pointer;} .grow.tap:active{background:var(--surface-press);}
  .gtile{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;box-shadow:0 1px 1px rgba(0,0,0,.10);}
  .gtile .ic{width:20px;height:20px;}
  .gtx{flex:1;min-width:0;}
  .gtx b{font-weight:600;font-size:1.05rem;display:block;letter-spacing:-.2px;}
  .gtx small{color:var(--secondary);font-size:.86rem;}
  .gchev{color:var(--tertiary);flex:0 0 auto;} .gchev .ic{width:19px;height:19px;stroke-width:2.4;}
  .gval{color:var(--secondary);font-variant-numeric:tabular-nums;flex:0 0 auto;font-size:1rem;}

  /* ===== Formularios ===== */
  .field{margin-bottom:6px;}
  .field>label{display:block;font-size:.8rem;font-weight:600;color:var(--secondary);margin:22px 0 8px 4px;}
  .field>label .soft{font-weight:400;text-transform:none;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;min-height:var(--tap);border:.5px solid var(--separator);border-radius:14px;
    background:var(--surface);color:var(--label);font-size:1.08rem;padding:0 15px;font-family:inherit;
    box-shadow:var(--shadow-card);transition:border-color .15s, box-shadow .15s;}
  textarea{padding:13px 15px;min-height:74px;line-height:1.45;resize:vertical;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft);}
  .row2{display:flex;gap:12px;} .row2 .field{flex:1;min-width:0;}

  /* Chips / pills */
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:none;background:#E7E7EC;color:var(--label);border-radius:12px;padding:11px 16px;font-size:1.02rem;font-weight:500;cursor:pointer;min-height:46px;transition:transform .08s;}
  .chip:active{transform:scale(.95);}
  .chip.sel,.chip.gold.sel{background:var(--accent);color:#fff;}
  .chip.add{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--separator);}

  /* Total */
  .total-box{background:var(--surface);border-radius:var(--radius);padding:15px 18px;display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px;box-shadow:var(--shadow-card);}
  .total-box .lbl{font-weight:500;color:var(--secondary);}
  .total-box .val{font-size:1.7rem;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--accent);}

  /* Calendario */
  .cal{background:var(--surface);border-radius:var(--radius);padding:12px 10px 6px;box-shadow:var(--shadow-card);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px;}
  .cal-title{font-weight:700;letter-spacing:-.2px;}
  .cal-nav{width:40px;height:40px;border:none;background:transparent;color:var(--accent);border-radius:50%;font-size:1.5rem;cursor:pointer;}
  .cal-nav:active{background:var(--surface-press);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-dow{text-align:center;font-size:.72rem;color:var(--secondary);font-weight:600;padding:2px 0 6px;}
  .cal-day{aspect-ratio:1;border:none;background:transparent;border-radius:50%;font-size:1.02rem;font-weight:500;color:var(--label);cursor:pointer;transition:transform .08s;}
  .cal-day:active{transform:scale(.9);}
  .cal-day.sel{background:var(--accent);color:#fff;font-weight:700;}
  .cal-count{margin:12px 4px 2px;font-size:.9rem;color:var(--secondary);text-align:center;}
  .cal-count b{color:var(--accent);}

  /* Foto */
  .foto-btn{width:100%;min-height:var(--tap);border:none;background:var(--surface);border-radius:14px;color:var(--accent);font-weight:500;font-size:1.04rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:var(--shadow-card);}
  .foto-btn:active{background:var(--surface-press);}
  .foto-btn .ic{width:22px;height:22px;}
  .foto-preview{margin-top:12px;position:relative;display:none;}
  .foto-preview img{width:100%;border-radius:14px;display:block;box-shadow:var(--shadow-card);}
  .foto-preview .x{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:1rem;cursor:pointer;backdrop-filter:blur(6px);}
  .foto-note{font-size:.82rem;color:var(--secondary);margin:8px 0 0 4px;line-height:1.4;}

  /* Botones */
  .save{width:100%;min-height:52px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:1.1rem;font-weight:600;letter-spacing:-.2px;cursor:pointer;margin-top:22px;box-shadow:var(--shadow-btn);transition:transform .08s,background .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .save:active{transform:scale(.985);background:var(--accent-press);}
  .save.gold{background:var(--gold);} .save.rust{background:var(--rust);}
  .save .ic{width:21px;height:21px;}
  .btn-outline{width:100%;min-height:var(--tap);border:none;background:var(--surface);border-radius:14px;font-size:1.04rem;font-weight:500;color:var(--accent);cursor:pointer;margin-bottom:11px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:var(--shadow-card);}
  .btn-outline:active{background:var(--surface-press);}
  .btn-outline .ic{width:21px;height:21px;}
  .linkbtn{background:none;border:none;color:var(--accent);font-weight:500;cursor:pointer;font-size:.98rem;padding:10px 4px;}
  .danger-link{color:var(--danger);background:var(--surface);border:none;font-weight:500;cursor:pointer;font-size:1.02rem;padding:15px;width:100%;border-radius:14px;box-shadow:var(--shadow-card);margin-top:12px;}

  /* Segmentado */
  .seg{display:flex;background:#E4E4E9;border-radius:10px;padding:2px;margin:6px 0 20px;}
  .seg button{flex:1;min-height:38px;border:none;background:transparent;font-weight:600;font-size:.95rem;color:var(--label);border-radius:8px;cursor:pointer;transition:background .18s;letter-spacing:-.2px;}
  .seg button.sel{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.02);}

  /* Cards de análisis */
  .card{background:var(--surface);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow-card);}
  .card h3{margin:0 0 10px;font-size:.82rem;font-weight:600;color:var(--secondary);letter-spacing:.1px;}
  .line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:.5px solid var(--separator);font-size:1.05rem;}
  .line:last-child{border-bottom:none;}
  .line .k{color:var(--label);} .line .v{font-weight:600;font-variant-numeric:tabular-nums;}
  .line .k b{font-weight:700;}
  .bigline{display:flex;justify-content:space-between;align-items:baseline;padding-top:4px;}
  .bigline .k{font-weight:600;font-size:1.05rem;} .bigline .v{font-weight:800;font-size:1.6rem;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
  .pos{color:var(--accent);} .neg{color:var(--rust);}
  .chart svg{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:18px;font-size:.8rem;color:var(--secondary);margin-top:10px;justify-content:center;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}

  /* Registros */
  .empty{text-align:center;color:var(--secondary);padding:56px 24px;}
  .empty .ic{width:42px;height:42px;color:var(--tertiary);margin-bottom:10px;}
  .rec-amt{font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .rdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .rdot.ing{background:var(--accent);} .rdot.egr{background:var(--rust);} .rdot.plan{background:var(--slate);}

  .hint{font-size:.86rem;color:var(--secondary);margin:12px 4px 0;line-height:1.45;}
  .pill-ok{display:inline-block;background:var(--accent-soft);color:var(--accent-press);border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:600;}

  /* Planificador */
  .plan-item{display:flex;align-items:center;gap:10px;padding:11px 14px;position:relative;background:var(--surface);}
  .plan-item+.plan-item::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--separator);}
  .plan-item .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-press);font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .plan-item .tx{flex:1;font-size:1rem;border:none;background:none;min-height:auto;padding:2px 0;box-shadow:none;}
  .plan-item .tx:focus{box-shadow:none;}
  .plan-item .mv{background:#EEE;border:none;color:var(--slate);width:30px;height:30px;border-radius:8px;font-size:1rem;cursor:pointer;flex:0 0 auto;}
  .plan-item .rm{background:none;border:none;color:var(--danger);font-size:1.15rem;cursor:pointer;flex:0 0 auto;padding:0 4px;}
  #planprev{margin-top:16px;display:none;}
  #planprev img{width:100%;border-radius:14px;display:block;box-shadow:var(--shadow-card);}

  /* Tab bar inferior esmerilada */
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:rgba(248,248,250,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--separator);display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .tabbar .inner{max-width:540px;margin:0 auto;width:100%;display:flex;}
  .tabbar button{flex:1;background:none;border:none;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--secondary);font-size:.64rem;font-weight:600;cursor:pointer;letter-spacing:.1px;}
  .tabbar button .ic{width:25px;height:25px;stroke-width:1.8;}
  .tabbar button.active{color:var(--accent);}

  /* Toast */
  #toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(16px);
    background:rgba(28,28,30,.95);color:#fff;padding:13px 18px;border-radius:14px;font-weight:500;
    display:flex;align-items:center;gap:16px;opacity:0;pointer-events:none;transition:.28s;z-index:50;max-width:90%;
    backdrop-filter:blur(10px);box-shadow:0 8px 26px rgba(0,0,0,.28);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  #toast button{background:none;color:#5AC8FA;border:none;font-weight:600;cursor:pointer;font-size:1rem;padding:0;}

  /* Impresión de reporte */
  #printarea{display:none;}
  @media print{ body{background:#fff;} .app,#toast,.tabbar{display:none !important;} #printarea{display:block !important;} }
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="badge" src="logo-badge.jpg" alt="" onerror="this.style.display='none'">
    <span class="wm">Finca La Esperanza</span>
    <button class="gear" id="gearbtn" aria-label="Ajustes"></button>
  </header>
  <div class="statusline" id="statusline"><span class="dot"></span><span id="statustext">Todo guardado</span></div>
  <main id="view"></main>
</div>
<nav class="tabbar"><div class="inner" id="tabbar"></div></nav>
<div id="toast"></div>
<div id="printarea"></div>

<script>
const $ = s => document.querySelector(s);
const view = $('#view');

/* ---------- Íconos ---------- */
const ICONS = {
  farmer:'<path d="M4 9h16"/><path d="M6.5 9a5.5 5 0 0 1 11 0"/><circle cx="12" cy="14" r="3"/><path d="M5.5 21c.6-3 3.2-4.5 6.5-4.5S18 18 18.5 21"/>',
  coin:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.4v9.2"/><path d="M14.6 9.3c-.6-.9-1.6-1.3-2.6-1.3-1.4 0-2.5.8-2.5 1.9 0 1.2 1.1 1.7 2.5 2s2.6.8 2.6 2c0 1.2-1.2 2-2.6 2-1.1 0-2.1-.5-2.7-1.4"/>',
  receipt:'<path d="M6 3.5h12v17l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2z"/><path d="M9 8.5h6"/><path d="M9 12.5h6"/>',
  chart:'<path d="M4 4v16h16"/><rect x="7.3" y="12" width="2.6" height="5"/><rect x="11.8" y="8.5" width="2.6" height="8.5"/><rect x="16.3" y="14" width="2.6" height="3"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3.5v3.5"/><path d="M16 3.5v3.5"/>',
  doc:'<path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5V8h4"/><path d="M9.5 12.5h5"/><path d="M9.5 15.5h5"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>',
  chevron:'<path d="M9 6l6 6-6 6"/>', back:'<path d="M15 5l-7 7 7 7"/>',
  gallery:'<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l4.5-4 3 2.5L15 11l5 5"/>',
  home:'<path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.5V20h12v-9.5"/>',
  spark:'<path d="M12 3.5l1.9 4.6L18.5 10l-4.6 1.9L12 16.5l-1.9-4.6L5.5 10l4.6-1.9z"/>',
  share:'<path d="M12 15V4"/><path d="M8.5 7.5 12 4l3.5 3.5"/><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/>'
};
function icon(name){ return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||''}</svg>`; }
function tile(name,color){ return `<span class="gtile" style="background:${color}">${icon(name)}</span>`; }

/* ---------- Datos por defecto ---------- */
const VACAS_FIJAS = [
  'Chequear las vacas.',
  'Revisar agua y alimentación de las vacas.',
  'Estar pendiente de cualquier novedad en las vacas.',
  'Estar pendiente del parto de alguna vaca.'
];
const TAREAS_COMUNES = [
  'Cosechar cacao y venderlo.','Cosechar verde y venderlo.','Limpiar el verde con guadaña.',
  'Limpiar con machete.','Terminar burrito.','Revisar alambrada.',
  'Comprar vacuna para el carbunco.','Cosechar y limpiar maqueño.','Eliminar casas de cubos.'
];
const DEFAULTS = {
  trabajadores: ['Washington'],
  formasPago: [ {n:'Jornal',p:15}, {n:'Guadaña',p:30}, {n:'Rodeo de vacas',p:5} ],
  productos: [ {n:'Cacao en libras',u:'libras'}, {n:'Caja de verde',u:'cajas'}, {n:'Litro de leche',u:'litros'} ],
  gastos: ['Alambre','Combustible','Herramientas','Medicina animales','Vacuna'],
  ultimoPrecio: {}, appsUrl:'', token:'', sheetUrl:''
};
let META = null;

/* ---------- Almacenamiento (IndexedDB + respaldo memoria) ---------- */
let db=null, mem={registros:new Map(),fotos:new Map(),meta:new Map()}, useMem=false;
function openDB(){
  return new Promise((res)=>{
    let done=false; const finish=()=>{ if(!done){done=true;res();} };
    const t=setTimeout(()=>{ useMem=true; finish(); },1500);
    try{
      if(!('indexedDB' in window)||!window.indexedDB){ useMem=true; clearTimeout(t); return finish(); }
      const rq=indexedDB.open('finca-esperanza',1);
      rq.onupgradeneeded=e=>{ const d=e.target.result;
        if(!d.objectStoreNames.contains('registros')) d.createObjectStore('registros',{keyPath:'id'});
        if(!d.objectStoreNames.contains('fotos')) d.createObjectStore('fotos',{keyPath:'id'});
        if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'k'}); };
      rq.onsuccess=e=>{ db=e.target.result; clearTimeout(t); finish(); };
      rq.onerror=()=>{ useMem=true; clearTimeout(t); finish(); };
      rq.onblocked=()=>{ useMem=true; clearTimeout(t); finish(); };
    }catch(e){ useMem=true; clearTimeout(t); finish(); }
  });
}
function txs(store,mode='readonly'){ return db.transaction(store,mode).objectStore(store); }
function put(store,val){ if(useMem){ mem[store].set(val.id||val.k,val); return Promise.resolve(); }
  return new Promise((res,rej)=>{ const r=txs(store,'readwrite').put(val); r.onsuccess=res; r.onerror=()=>rej(r.error); }); }
function del(store,id){ if(useMem){ mem[store].delete(id); return Promise.resolve(); }
  return new Promise((res,rej)=>{ const r=txs(store,'readwrite').delete(id); r.onsuccess=res; r.onerror=()=>rej(r.error); }); }
function get(store,id){ if(useMem){ return Promise.resolve(mem[store].get(id)); }
  return new Promise((res,rej)=>{ const r=txs(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function all(store){ if(useMem){ return Promise.resolve([...mem[store].values()]); }
  return new Promise((res,rej)=>{ const r=txs(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
async function loadMeta(){ const s=await get('meta','config');
  META=Object.assign({},DEFAULTS, s?s.v:{});

/* ---------- Utilidades ---------- */
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_AB=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fechaLarga(){ const d=new Date(); return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}`; }
function num(v){ if(typeof v==='number')return v; if(v==null)return 0; return parseFloat(String(v).replace(/\s/g,'').replace(',','.'))||0; }
function money(n){ return '$'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function nuevoId(){ const d=new Date(),p=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${Math.random().toString(36).slice(2,4)}`; }
function parseFecha(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function lunesDe(d){ const day=(d.getDay()+6)%7; const l=new Date(d); l.setDate(d.getDate()-day); l.setHours(0,0,0,0); return l; }
function semanaDe(iso){ const l=lunesDe(parseFecha(iso)); const dom=new Date(l); dom.setDate(l.getDate()+6);
  return `${l.getDate()} ${MESES_AB[l.getMonth()]} - ${dom.getDate()} ${MESES_AB[dom.getMonth()]} ${dom.getFullYear()}`; }
function mismaSemana(a,b){ return semanaDe(a)===semanaDe(b); }
function semanaLabelActual(){ const l=lunesDe(new Date()); const dom=new Date(l); dom.setDate(l.getDate()+6);
  const mes=MESES[dom.getMonth()].toUpperCase();
  return l.getMonth()===dom.getMonth() ? `SEMANA ${l.getDate()} - ${dom.getDate()} DE ${mes}` :
    `SEMANA ${l.getDate()} ${MESES_AB[l.getMonth()].toUpperCase()} - ${dom.getDate()} ${mes}`; }
function h(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* ---------- Foto ---------- */
function comprimir(file,maxDim=1280,q=0.68){ return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{ let{width:w,height:hh}=img;
    if(w>=hh&&w>maxDim){ hh=Math.round(hh*maxDim/w); w=maxDim; } else if(hh>maxDim){ w=Math.round(w*maxDim/hh); hh=maxDim; }
    const c=document.createElement('canvas'); c.width=w; c.height=hh; c.getContext('2d').drawImage(img,0,0,w,hh);
    c.toBlob(b=>{ URL.revokeObjectURL(url); res(b); },'image/jpeg',q); };
  img.onerror=e=>{ URL.revokeObjectURL(url); rej(e); }; img.src=url; }); }
function blobURL(b){ return b?URL.createObjectURL(b):''; }
function loadImg(src){ return new Promise(r=>{ const i=new Image(); let done=false; const fin=v=>{ if(!done){done=true;r(v);} };
  i.onload=()=>fin(i); i.onerror=()=>fin(null); setTimeout(()=>fin(null),4000); i.src=src; }); }
function blob2b64(b){ return new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(b); }); }

/* ---------- Sincronización ---------- */
function online(){ return navigator.onLine; }
async function pendientes(){ return (await all('registros')).filter(r=>r.sync!=='ok'); }
async function actualizarSync(){ const bar=$('#statusline'),txt=$('#statustext'); const p=await pendientes(); bar.className='statusline';
  if(!online()){ bar.classList.add('off'); txt.textContent=p.length?`Sin señal · ${p.length} por subir`:'Sin señal'; return; }
  if(p.length){ bar.classList.add('pend'); txt.textContent=META.appsUrl?`${p.length} por subir`:`${p.length} guardados en el teléfono`; }
  else txt.textContent='Todo guardado'; }
async function sincronizar(manual){ if(!META.appsUrl||!online()){ actualizarSync(); return; }
  for(const r of await pendientes()){ try{ let foto=null; if(r.fotoId){ const f=await get('fotos',r.fotoId); if(f&&f.blob) foto=await blob2b64(f.blob); }
    const resp=await fetch(META.appsUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:META.token,registro:limpiar(r),foto})});
    const data=await resp.json(); if(data&&data.ok){ r.sync='ok'; if(data.comprobanteUrl)r.comprobanteUrl=data.comprobanteUrl; await put('registros',r); } }catch(e){ break; } }
  actualizarSync(); if(manual) toast('Sincronización intentada'); }
function limpiar(r){ const {fotoId,...rest}=r; return rest; }

/* ---------- Toast ---------- */
let toastTimer=null;
function toast(msg,undoFn){ const t=$('#toast'); t.innerHTML=''; t.appendChild(document.createTextNode(msg));
  if(undoFn){ const b=document.createElement('button'); b.textContent='Deshacer'; b.onclick=()=>{ undoFn(); t.classList.remove('show'); }; t.appendChild(b); }
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), undoFn?5000:2200); }

/* ---------- Calendario multi-día ---------- */
function calendarPicker(container, selectedSet, onChange){
  let cur=new Date(); cur.setDate(1);
  function iso(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  function render(){
    container.innerHTML='';
    const wrap=h('<div class="cal"></div>');
    const head=h(`<div class="cal-head"><button type="button" class="cal-nav" data-prev>‹</button><span class="cal-title"></span><button type="button" class="cal-nav" data-next>›</button></div>`);
    head.querySelector('.cal-title').textContent=MESES[cur.getMonth()]+' '+cur.getFullYear();
    head.querySelector('[data-prev]').onclick=()=>{ cur.setMonth(cur.getMonth()-1); render(); };
    head.querySelector('[data-next]').onclick=()=>{ cur.setMonth(cur.getMonth()+1); render(); };
    wrap.appendChild(head);
    const grid=h('<div class="cal-grid"></div>');
    ['L','M','X','J','V','S','D'].forEach(d=>grid.appendChild(h(`<div class="cal-dow">${d}</div>`)));
    const first=new Date(cur.getFullYear(),cur.getMonth(),1);
    const start=(first.getDay()+6)%7;
    const days=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
    for(let i=0;i<start;i++) grid.appendChild(h('<div></div>'));
    for(let d=1;d<=days;d++){ const k=iso(cur.getFullYear(),cur.getMonth(),d);
      const cell=h(`<button type="button" class="cal-day">${d}</button>`); if(selectedSet.has(k))cell.classList.add('sel');
      cell.onclick=()=>{ if(selectedSet.has(k))selectedSet.delete(k); else selectedSet.add(k); cell.classList.toggle('sel'); onChange(); };
      grid.appendChild(cell); }
    wrap.appendChild(grid); container.appendChild(wrap);
  }
  render();
}

    const ing={},egr={}; let mano=0,tI=0,tE=0;
    filt.forEach(r=>{ if(r.categoria==='Ingreso'){ ing[r.nombreDesc]=(ing[r.nombreDesc]||0)+r.total; tI+=r.total; }
      else { tE+=r.total; if(r.tipo==='Trabajador') mano+=r.total; else egr[r.nombreDesc]=(egr[r.nombreDesc]||0)+r.total; } });
    const neta=tI-tE;
    cont.appendChild(h(`<div class="card"><div class="bigline"><span class="k">Ganancia neta</span><span class="v ${neta>=0?'pos':'neg'}">${money(neta)}</span></div></div>`));
    const cI=h('<div class="card"><h3>INGRESOS</h3></div>');
    Object.keys(ing).forEach(k=>cI.appendChild(h(`<div class="line"><span class="k">${k}</span><span class="v">${money(ing[k])}</span></div>`)));
    cI.appendChild(h(`<div class="line"><span class="k"><b>Total ingresos</b></span><span class="v">${money(tI)}</span></div>`)); cont.appendChild(cI);
    const cE=h('<div class="card"><h3>EGRESOS</h3></div>');
    if(mano)cE.appendChild(h(`<div class="line"><span class="k">Mano de obra</span><span class="v">${money(mano)}</span></div>`));
    Object.keys(egr).forEach(k=>cE.appendChild(h(`<div class="line"><span class="k">${k}</span><span class="v">${money(egr[k])}</span></div>`)));
    cE.appendChild(h(`<div class="line"><span class="k"><b>Total egresos</b></span><span class="v">${money(tE)}</span></div>`)); cont.appendChild(cE);
    cont.appendChild(graficoBarras(filt)); const l=graficoPrecio(regs); if(l)cont.appendChild(l);
  })();
  return el;
};
function graficoBarras(regs){ const byDay={};
  regs.forEach(r=>{ byDay[r.fecha]=byDay[r.fecha]||{i:0,e:0}; if(r.categoria==='Ingreso')byDay[r.fecha].i+=r.total; else byDay[r.fecha].e+=r.total; });
  const dias=Object.keys(byDay).sort().slice(-7); const max=Math.max(1,...dias.map(d=>Math.max(byDay[d].i,byDay[d].e)));
  const W=460,H=180,pad=24,bw=(W-pad*2)/dias.length; let bars='';
  dias.forEach((d,i)=>{ const x=pad+i*bw,ih=byDay[d].i/max*(H-50),eh=byDay[d].e/max*(H-50),w=bw*0.28;
    bars+=`<rect x="${x+bw/2-w-3}" y="${H-30-ih}" width="${w}" height="${ih}" rx="3" fill="#137A4F"/>`;
    bars+=`<rect x="${x+bw/2+3}" y="${H-30-eh}" width="${w}" height="${eh}" rx="3" fill="#BB4D2C"/>`;
    const dd=d.split('-'); bars+=`<text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="11" fill="#8A8A8F">${+dd[2]}/${+dd[1]}</text>`; });
  return h(`<div class="card"><h3>INGRESOS VS EGRESOS POR DÍA</h3><div class="chart"><svg viewBox="0 0 ${W} ${H}">${bars}</svg></div>
    <div class="legend"><span><i style="background:#137A4F"></i>Ingresos</span><span><i style="background:#BB4D2C"></i>Egresos</span></div></div>`); }
function graficoPrecio(regs){ const v=regs.filter(r=>r.tipo==='Venta-Cacao'&&r.precio>0&&r.nombreDesc.toLowerCase().includes('libra')).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(v.length<2)return null; const W=460,H=160,pad=30; const pr=v.map(x=>x.precio),mn=Math.min(...pr),mx=Math.max(...pr),rg=(mx-mn)||1;
  const pts=v.map((x,i)=>[pad+i*((W-pad*2)/(v.length-1)),H-25-((x.precio-mn)/rg)*(H-50)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#137A4F"/>`).join('');
  return h(`<div class="card"><h3>PRECIO DEL CACAO (LIBRA)</h3><div class="chart"><svg viewBox="0 0 ${W} ${H}"><path d="${path}" fill="none" stroke="#137A4F" stroke-width="2.5"/>${dots}<text x="${pad}" y="14" font-size="11" fill="#8A8A8F">${money(mx)}</text><text x="${pad}" y="${H-6}" font-size="11" fill="#8A8A8F">${money(mn)}</text></svg></div></div>`); }

async function compartir(blob,filename){
  try{ const file=new File([blob],filename,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Tareas Finca La Esperanza'}); return; } }catch(e){}
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); toast('Imagen descargada');
}
async function generarPlanImagen(plan){
  const W=1080, PAD=64, logo=await loadImg('logo.jpg');
  const c=document.createElement('canvas'), ctx=c.getContext('2d');
  const fTitle='800 56px -apple-system,Arial', fSub='700 30px -apple-system,Arial',
        fSec='800 30px -apple-system,Arial', fItem='400 30px -apple-system,Arial', fNum='800 30px -apple-system,Arial';
  function wrap(text,maxW,font){ ctx.font=font; const words=text.split(' '); const lines=[]; let ln='';
    for(const w of words){ const t=ln?ln+' '+w:w; if(ctx.measureText(t).width>maxW&&ln){ lines.push(ln); ln=w; } else ln=t; } if(ln)lines.push(ln); return lines; }
  const titleLines=[(plan.modo==='plan'?'TAREAS':'TAREAS REALIZADAS'),'FINCA LA ESPERANZA'];
  const contentW=W-PAD*2, itemIndent=54, itemW=contentW-itemIndent;
  const sec1='TAREAS TODOS LOS DÍAS (LUNES A DOMINGO) - VACAS';
  const sec2=plan.modo==='plan'?'TAREAS DE LUNES A VIERNES':'TAREAS REALIZADAS';
  const vacas=plan.vacas.filter(x=>x&&x.trim());
  let H=44+titleLines.length*62+6+44+30;
  function blockH(header,items){ let hh=wrap(header,contentW,fSec).length*38+20; items.forEach(it=>{ hh+=wrap(it,itemW,fItem).length*40+8; }); return hh+24; }
  H+=blockH(sec1,vacas)+blockH(sec2,plan.tareas)+50;
  c.width=W; c.height=H;
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
  if(logo){ const ls=190; ctx.drawImage(logo, W-PAD-ls, 30, ls, ls); }
  let y=64; ctx.textBaseline='alphabetic'; ctx.fillStyle='#137A4F';
  titleLines.forEach(t=>{ ctx.font=fTitle; ctx.fillText(t, PAD, y+46); y+=62; });
  y+=2; ctx.fillStyle='#3a3a3a'; ctx.font=fSub; ctx.fillText(plan.semana, PAD, y+30); y+=52;
  ctx.strokeStyle='#B8871C'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke(); y+=34;
  function drawBlock(header,items,color,startNum){
    ctx.fillStyle=color; ctx.font=fSec; wrap(header,contentW,fSec).forEach(l=>{ ctx.fillText(l,PAD,y+28); y+=38; });
    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(PAD,y-4); ctx.lineTo(W-PAD,y-4); ctx.stroke(); y+=18;
    items.forEach((it,idx)=>{ const lines=wrap(it,itemW,fItem);
      ctx.fillStyle=color; ctx.font=fNum; ctx.fillText((startNum+idx)+'.', PAD, y+26);
      ctx.fillStyle='#211A14'; ctx.font=fItem; lines.forEach((l,li)=>{ ctx.fillText(l, PAD+itemIndent, y+26+li*40); }); y+=lines.length*40+8; });
    y+=24;
  }
  drawBlock(sec1, vacas, '#1B3A5B', 1);
  drawBlock(sec2, plan.tareas, '#137A4F', vacas.length+1);
  return await new Promise(res=>c.toBlob(b=>res(b),'image/png',0.92));
}

async function exportarCSV(){ const regs=(await all('registros')).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const cols=['id','fecha','tipo','nombreDesc','detalle','cantidad','unidad','precio','total','categoria','notas','semana','comprobanteUrl','sync'];
  const head=['ID','Fecha','Tipo','Nombre/Desc','Detalle','Cantidad','Unidad','Precio','Total','Categoría','Notas','Semana','Comprobante','Estado'];
  const esc=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const rows=[head.join(',')].concat(regs.map(r=>cols.map(c=>esc(r[c])).join(',')));
  const blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Finca_La_Esperanza_${hoyISO()}.csv`; a.click(); toast('Tabla descargada'); }
